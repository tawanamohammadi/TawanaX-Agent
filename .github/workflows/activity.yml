name: Generate Activity Report

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Activity Stats
        run: |
          echo "# 📊 TawanaX-Agent Activity Report" > docs/ACTIVITY.md
          echo "" >> docs/ACTIVITY.md
          echo "> Auto-generated on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> docs/ACTIVITY.md
          echo "" >> docs/ACTIVITY.md
          
          echo "## 📈 Repository Stats" >> docs/ACTIVITY.md
          echo "" >> docs/ACTIVITY.md
          echo "| Metric | Value |" >> docs/ACTIVITY.md
          echo "|--------|-------|" >> docs/ACTIVITY.md
          echo "| Total Commits | $(git rev-list --count HEAD) |" >> docs/ACTIVITY.md
          echo "| Contributors | $(git log --format='%ae' | sort -u | wc -l) |" >> docs/ACTIVITY.md
          echo "| Files | $(git ls-files | wc -l) |" >> docs/ACTIVITY.md
          echo "| Lines of Code | $(git ls-files | xargs wc -l 2>/dev/null | tail -1 | awk '{print $1}') |" >> docs/ACTIVITY.md
          echo "" >> docs/ACTIVITY.md
          
          echo "## 🕐 Recent Commits" >> docs/ACTIVITY.md
          echo "" >> docs/ACTIVITY.md
          echo "| Date | Author | Message |" >> docs/ACTIVITY.md
          echo "|------|--------|---------|" >> docs/ACTIVITY.md
          git log --oneline --format="| %ad | %an | %s |" --date=short -10 >> docs/ACTIVITY.md
          echo "" >> docs/ACTIVITY.md
          
          echo "## 📁 Project Structure" >> docs/ACTIVITY.md
          echo "" >> docs/ACTIVITY.md
          echo "\`\`\`" >> docs/ACTIVITY.md
          find . -type f -name "*.py" -o -name "*.md" -o -name "*.html" -o -name "*.yml" | head -30 | sort >> docs/ACTIVITY.md
          echo "\`\`\`" >> docs/ACTIVITY.md
          echo "" >> docs/ACTIVITY.md
          
          echo "---" >> docs/ACTIVITY.md
          echo "" >> docs/ACTIVITY.md
          echo "*Generated by TawanaX-Agent Activity Workflow*" >> docs/ACTIVITY.md

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TawanaX-Agent Bot"
          git add docs/ACTIVITY.md
          git diff --staged --quiet || git commit -m "📊 Update activity report [skip ci]"
          git push
